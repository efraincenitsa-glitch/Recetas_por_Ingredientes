/* =======================
   Normalización / sinónimos (tolerancia a variantes)
======================= */
const NORM = {
  "chicharo":"Chícharo","chícharos":"Chícharo","chicharos":"Chícharo",
  "elote":"Elote/maíz","maiz":"Elote/maíz","maíz":"Elote/maíz",
  "champiñon":"Champiñón","champinion":"Champiñón","hongo":"Champiñón","hongos":"Champiñón",
  "pimiento":"Pimiento rojo", // valor por defecto si alguien usa genérico
  "cebolla":"Cebolla blanca"
};
function normalizeName(x) {
  const k = x.toLowerCase().trim();
  return NORM[k] || x;
}

/* =======================
   Recetas (se agregan vegetarianas que cubren tu caso)
======================= */

  { nombre: "Fajitas de res con pimiento y cebolla", required:["Res en tiras","Pimiento rojo","Cebolla blanca"], optional:["Ajo","Calabacita","Limón","Cilantro"], pasos:[

  {

    pasos: [

      "Termina con unas gotas de limón y cilantro."
    ]

/* =======================
   Sustitutos (para sugerencias en la UI)
======================= */
const SUSTITUTOS = {
  "Pimiento rojo":["Pimiento verde","Pimiento amarillo"],
  "Pimiento verde":["Pimiento rojo","Pimiento amarillo"],
  "Cebolla blanca":["Cebolla morada","Cambray (cebollas)"],
  "Cebolla morada":["Cebolla blanca","Cambray (cebollas)"],
  "Ajo":["Ajo en polvo","Cebolla blanca"],
  "Res en tiras":["Bistec de res","Res molida"],
  "Pollo":["Pavo","Cerdo"],
  "Atún en lata":["Pescado blanco desmenuzado","Pollo cocido"],
  "Pescado blanco":["Tilapia","Merluza"],
  "Camarón":["Pescado blanco","Calamar"],
  "Tomate":["Jitomate cherry","Tomatillo"],
  "Aguacate":["Yogur natural","Mayonesa ligera"],
  "Limón":["Naranja","Toronja"]
};

/* =======================
   Estado/Referencias
======================= */
let contVerduras, contFrutas, contCarnes, matchBox, recipeBox;
const KEY = 'seleccion_recetas_v1';

/* =======================
   Generación de listas
======================= */
function checkbox(id, name){
  const el = document.createElement('label');
  el.innerHTML = `<input type="checkbox" value="${name}" data-group="${id}"><span>${name}</span>`;
  return el;
}
function renderLists(){
  [[contVerduras,VERDURAS,'v'], [contFrutas,FRUTAS,'f'], [contCarnes,CARNES,'c']].forEach(([container,items,group])=>{
    container.innerHTML = '';
    items.forEach(n => container.appendChild(checkbox(group,n)));
  });
  restoreSelection();
}

/* =======================
   Persistencia
======================= */
function getSelection(){
  // Normaliza nombres seleccionados para tolerar variantes
  return new Set(
    Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
      .map(i => normalizeName(i.value))
  );
}
function saveSelection(){
  localStorage.setItem(KEY, JSON.stringify(Array.from(getSelection())));
}
function restoreSelection(){
  const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
  document.querySelectorAll('input[type="checkbox"]').forEach(i => {
    // Marca si coincide exactamente o si la normalización hace match
    const v = i.value;
    const n = normalizeName(v);
    i.checked = saved.includes(v) || saved.includes(n);
  });
}

/* =======================
   Motor de coincidencias
======================= */
function puntuarReceta(rec, seleccionSet){
  // Normaliza internamente los nombres de la receta también
  const req = (rec.required||[]).map(normalizeName);
  const opt = (rec.optional||[]).map(normalizeName);
  const tieneReq = req.filter(x=>seleccionSet.has(x));
  const tieneOpt = opt.filter(x=>seleccionSet.has(x));
  const faltan   = req.filter(x=>!seleccionSet.has(x));
  // Política: al menos 60% de requeridos (o todos si req<=2)
  const minReq = Math.max(1, Math.ceil(req.length * 0.6));
  const cumple = (req.length <= 2) ? (tieneReq.length === req.length) : (tieneReq.length >= minReq);
  const score = tieneReq.length*2 + tieneOpt.length;
  return { cumple, score, tieneReq, tieneOpt, faltan, req, opt };
}

/* =======================
   Plan B: recetas generadas con lo que haya
======================= */
function buildVegStirFry(sel){
  const veg = [...sel].filter(x => VERDURAS.includes(x));
  if(veg.length < 2) return null;
  const base = veg.slice(0, Math.min(4, veg.length)); // hasta 4
  return {
    nombre: `Salteado de ${base.join(', ')}`,
    required: base,
    optional: ["Cebolla blanca","Ajo","Limón","Cilantro"],
    pasos: [
      "Corta en tamaños similares para que se cocinen parejo.",
      "Saltea primero lo más duro (papa/zanahoria), luego el resto.",
      "Ajusta sal y pimienta; termina con limón/cilantro."
    ],
    __auto:true
  };
}
function buildVegSoup(sel){
  const veg = [...sel].filter(x => VERDURAS.includes(x));
  if(veg.length < 3) return null;
  const base = veg.slice(0, Math.min(5, veg.length));
  return {
    nombre: `Sopa de ${base.join(', ')}`,
    required: base,
    optional: ["Cebolla blanca","Ajo","Perejil"],
    pasos: [
      "Sofríe cebolla y ajo (si tienes).",
      "Agrega las verduras, cubre con agua/caldo y hierve suave.",
      "Sazona al gusto; sirve con perejil."
    ],
    __auto:true
  };
}
function buildMeatStirFry(sel){
  const meats = [...sel].filter(x => CARNES.includes(x));
  const veg   = [...sel].filter(x => VERDURAS.includes(x));
  if(!meats.length || !veg.length) return null;
  const m = meats[0];
  const v = veg.slice(0, Math.min(3, veg.length));
  return {
    nombre: `${m} salteado con ${v.join(', ')}`,
    required: [m, ...v],
    optional: ["Cebolla blanca","Ajo","Limón"],
    pasos: [
      `Sella el ${m} con sal y pimienta; retira.`,
      "Saltea las verduras; regresa la carne.",
      "Ajusta sazón y termina con limón."
    ],
    __auto:true
  };
}

/* Devuelve una o más recetas generadas automáticamente (si aplica) */
function fallbacks(seleccionSet){
  const res = [];
  const f1 = buildMeatStirFry(seleccionSet); if(f1) res.push(f1);
  const f2 = buildVegStirFry(seleccionSet);  if(f2) res.push(f2);
  const f3 = buildVegSoup(seleccionSet);     if(f3) res.push(f3);
  return res;
}

let alternativas = [];
let idxAlt = 0;

function sugerir(seleccionSet){
  // 1) Evalúa recetas definidas
  let evaluadas = RECETAS.map(rec => {
    const ev = puntuarReceta(rec, seleccionSet);
    return { rec, ...ev };
  }).filter(x => x.cumple);

  // 2) Si no hay ninguna, crea fallbacks con lo seleccionado
  if(!evaluadas.length){
    const autos = fallbacks(seleccionSet);
    evaluadas = autos.map(rec => {
      const ev = puntuarReceta(rec, seleccionSet);
      // Para auto-recetas, las marcamos como "cumple" siempre que tenga al menos 2 ingredientes
      const tieneTotal = (ev.tieneReq.length + ev.tieneOpt.length);
      return { rec, ...ev, cumple: (tieneTotal >= 2) };
    }).filter(x => x.cumple);
  }

  // 3) Ordena por score y por menos faltantes
  evaluadas.sort((a,b)=> (b.score - a.score) || (a.faltan.length - b.faltan.length));

  alternativas = evaluadas;
  idxAlt = 0;
  return alternativas[0];
}

/* =======================
   Render de resultados
======================= */
function renderMatch(info){
  const matchBox = document.getElementById('match');
  const recipeBox = document.getElementById('recipe');

  if(!info){
    matchBox.innerHTML = `No encontré una receta clara con tu selección. <span class="muted">Prueba marcando 2–4 ingredientes clave (p. ej. una carne + 1–2 verduras).</span>`;
    recipeBox.style.display='none';
    return;
  }
  const {rec, tieneReq, tieneOpt, faltan} = info;
  const all = new Set([...(rec.required||[]), ...(rec.optional||[])]);
  const extra = [...getSelection()].filter(x => !all.has(x));

  matchBox.innerHTML = `
    <div>
      <h3>Mejor coincidencia: <span class="warn">${rec.nombre}${rec.__auto?' (generada)':''}</span></h3>
      <div class="chips" style="margin:8px 0">
        ${tieneReq.map(x=>`<span class="chip ok">✔ ${x}</span>`).join('')}
        ${tieneOpt.map(x=>`<span class="chip ok">＋ ${x}</span>`).join('')}
        ${faltan.map(x=>`<span class="chip miss">Falta: ${x}</span>`).join('')}
      </div>
      ${extra.length? `<div class="muted">No usados: ${extra.map(x=>`<span class="chip">${x}</span>`).join(' ')}</div>`:''}
      ${faltan.length? `<p style="margin-top:6px" class="muted">¿No tienes alguno? Sugerencias: ${faltan.map(f=>`<b>${f}</b> → ${(SUSTITUTOS[f]||['(sin sustituto claro)']).join(', ')}`).join(' • ')}</p>`:''}
    </div>
  `;

  recipeBox.style.display='block';
  recipeBox.innerHTML = `
    <h2>📝 ${rec.nombre}</h2>
    <h4>Ingredientes sugeridos</h4>
    <ul>
      ${[...(rec.required||[])].map(x=>`<li>${x}</li>`).join('')}
      ${(rec.optional||[]).length? `<li class="muted">Opcionales: ${(rec.optional||[]).join(', ')}</li>`:''}
      <li class="muted">Básicos de despensa: sal, pimienta, aceite, limón/vinagre</li>
    </ul>
    <h4>Pasos</h4>
    <ol>
      ${rec.pasos.map(p=>`<li>${p}</li>`).join('')}
    </ol>
  `;
}

/* =======================
   Handlers públicos (fallback de los botones)
======================= */
function sugerirClick(){
  try{
    const sel = getSelection();
    const mejor = sugerir(sel);
    renderMatch(mejor);
  }catch(e){
    console.error(e);
    showError('Ocurrió un error al sugerir receta.');
  }
}
function otraClick(){
  try{
    if(!alternativas.length){
      document.getElementById('match').innerHTML = 'Primero presiona "Sugerir receta".';
      return;
    }
    idxAlt = (idxAlt + 1) % alternativas.length;
    renderMatch(alternativas[idxAlt]);
  }catch(e){
    console.error(e);
    showError('Ocurrió un error al cambiar de sugerencia.');
  }
}
function limpiarClick(){
  try{
    document.querySelectorAll('input[type="checkbox"]').forEach(i=>i.checked=false);
    localStorage.setItem(KEY, JSON.stringify([]));
    alternativas = []; idxAlt = 0;
    document.getElementById('match').textContent = 'Selección limpia. Marca algunos ingredientes y presiona "Sugerir receta".';
    document.getElementById('recipe').style.display='none';
  }catch(e){
    console.error(e);
    showError('No se pudo limpiar la selección.');
  }
}

/* =======================
   Inicialización segura
======================= */
document.addEventListener('DOMContentLoaded', function(){
  try{
    // Referencias
    contVerduras = document.getElementById('list-verduras');
    contFrutas   = document.getElementById('list-frutas');
    contCarnes   = document.getElementById('list-carnes');

    // Render listas
    renderLists();

    // Guardado automático
    document.addEventListener('change', (e)=>{
      if(e.target.matches('input[type="checkbox"]')) saveSelection();
    });

    // Enlazar botones (además del fallback onclick del HTML)
    const btnSug   = document.getElementById('btn-sugerir');
    const btnOtra  = document.getElementById('btn-otra');
    const btnClear = document.getElementById('btn-limpiar');
    if(btnSug)   btnSug.addEventListener('click', sugerirClick, {passive:true});
    if(btnOtra)  btnOtra.addEventListener('click', otraClick, {passive:true});
    if(btnClear) btnClear.addEventListener('click', limpiarClick, {passive:true});

    // Primera sugerencia si ya hay selección guardada
    const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
    if(saved.length){
      const mejor = sugerir(new Set(saved.map(normalizeName)));
      renderMatch(mejor);
    }

    // Seguridad por si algún overlay quedara encima accidentalmente
    document.body.style.pointerEvents = 'auto';
  }catch(e){
    console.error(e);
    showError('Error inicializando la app. Revisa la consola del navegador.');
  }
});
</script>
